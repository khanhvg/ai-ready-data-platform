<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Công bố dữ liệu có kiểm soát</title><desc id="desc">Ba luồng có thứ tự: stage-commit, retry-resume và catalog-ingest handoff; numbering chỉ do renderer thêm.</desc><rect width="1200" height="600" fill="#fff"/><text x="40" y="43" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Công bố dữ liệu có kiểm soát (Controlled publication)</text><rect x="30" y="65" width="1140" height="475" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/><g font-family="Arial" font-size="18" fill="#102a43"><text x="50" y="100" font-weight="700">Dàn → commit (Stage → commit)</text><text x="50" y="130">1. Dàn snapshot</text><text x="50" y="158">2. Ghi object</text><text x="50" y="186">3. Kiểm tra object</text><text x="50" y="214">4. Commit con trỏ catalog</text><text x="50" y="242">5. Kiểm tra đọc lại</text><text x="50" y="292" font-weight="700">Thử lại → tiếp tục (Retry → resume)</text><text x="50" y="322">6. Phát hiện trạng thái dở dang</text><text x="50" y="350">7. Đọc trạng thái commit</text><text x="50" y="378">8. Tiếp tục idempotent</text><text x="50" y="406">9. Kiểm tra con trỏ</text><text x="50" y="434">10. Đóng attempt</text><text x="620" y="100" font-weight="700">Bàn giao catalog ingest</text><text x="620" y="130">11. Công bố current pointer</text><text x="620" y="158">12. Mở ingestion window</text><text x="620" y="186">13. Ingest physical</text><text x="620" y="214">14. Ingest logical</text><text x="620" y="242">15. Kiểm tra catalog</text><text x="620" y="270">16. Đóng cửa sổ</text></g><g stroke="#2563eb" stroke-width="4"><path d="M520 120 V445"/><path d="M1090 120 V290"/></g><text x="50" y="505" font-family="Arial" font-size="15" fill="#334155">Authority: object bất biến; catalog pointer chỉ đổi sau validate; metadata ingest không thay data authority.</text><text x="50" y="570" font-family="Arial" font-size="15" fill="#1f2937">Chú giải: số thứ tự xuất hiện đúng một lần; failure branch dùng commit state để resume, không blind retry.</text></svg>
