<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" data-source-sha256="59b67b3751510e6dee05f34c42c230734f300be46862e018c90002fd82e49099" data-raw-sha256="4136d88dcf346853a8155dd014d23a72347102ba4a0d43f37a5e2d3bbeef09d3"><title id="title">Công bố dữ liệu có kiểm soát (Controlled data publication)</title><desc id="desc">View kiến trúc tĩnh có nhãn tiếng Việt và văn bản thay thế theo đúng thứ tự quan hệ.</desc><rect width="1200" height="600" fill="#ffffff"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14213d">Công bố dữ liệu có kiểm soát (Controlled data publication)</text><rect data-node="step-1" x="35" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">1. Dàn snapshot</text><text x="47" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">curriculum → publisher</text><rect data-node="step-2" x="35" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="138" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">2. Ghi object</text><text x="47" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → objectStore</text><rect data-node="step-3" x="35" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">3. Kiểm tra object</text><text x="47" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → objectStore</text><rect data-node="step-4" x="35" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">4. Commit con trỏ catalog</text><text x="47" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → localCatalog</text><rect data-node="step-5" x="35" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">5. Kiểm tra đọc lại</text><text x="47" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">localCatalog → publisher</text><rect data-node="step-6" x="35" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">6. Phát hiện trạng thái dở dang</text><text x="47" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">objectStore → publisher</text><rect data-node="step-7" x="35" y="360" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="378" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">7. Đọc trạng thái commit</text><text x="47" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → localCatalog</text><rect data-node="step-8" x="35" y="408" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">8. Tiếp tục idempotent</text><text x="47" y="444" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → objectStore</text><rect data-node="step-9" x="35" y="456" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="474" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">9. Kiểm tra con trỏ</text><text x="47" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → localCatalog</text><rect data-node="step-10" x="35" y="504" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="522" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">10. Đóng attempt</text><text x="47" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → curriculum</text><rect data-node="step-11" x="615" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">11. Công bố con trỏ current</text><text x="627" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → localCatalog</text><rect data-node="step-12" x="615" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="138" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">12. Mở cửa sổ ingest</text><text x="627" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → metadataGovernance</text><rect data-node="step-13" x="615" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">13. Ingest physical metadata</text><text x="627" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">localCatalog → metadataGovernance</text><rect data-node="step-14" x="615" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">14. Ingest logical lineage</text><text x="627" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">publisher → metadataGovernance</text><rect data-node="step-15" x="615" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">15. Kiểm tra catalog</text><text x="627" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">metadataGovernance → operator</text><rect data-node="step-16" x="615" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">16. Đóng cửa sổ</text><text x="627" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → metadataGovernance</text><text x="40" y="580" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">Chú giải: số thứ tự do renderer tạo; quan hệ một chiều; failure/recovery giữ đúng trình tự.</text></svg>
