<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Khôi phục theo authority — chỉ khái niệm</title><desc id="desc">Bốn luồng khôi phục object-catalog, analytics, governance và evidence với hai mươi bước đúng thứ tự.</desc><rect width="1200" height="600" fill="#fff"/><text x="40" y="43" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Khôi phục theo authority — chỉ khái niệm</text><rect x="30" y="65" width="1140" height="475" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/><g font-family="Arial" font-size="18" fill="#102a43"><text x="50" y="100" font-weight="700">Object và catalog</text><text x="50" y="128">1. Tạo ranh giới trống</text><text x="50" y="156">2. Khôi phục object</text><text x="50" y="184">3. Đăng ký catalog</text><text x="50" y="212">4. Công bố current pointer</text><text x="50" y="240">5. Kiểm tra đọc table</text><text x="50" y="288" font-weight="700">Phân tích (Analytics)</text><text x="50" y="316">6. Khôi phục analytics authority</text><text x="50" y="344">7. Hydrate query state</text><text x="50" y="372">8. Khôi phục BI metadata</text><text x="50" y="400">9. Chạy equivalence</text><text x="50" y="428">10. Ghi RTO/RPO</text><text x="620" y="100" font-weight="700">Quản trị (Governance)</text><text x="620" y="128">11. Khôi phục DB</text><text x="620" y="156">12. Khôi phục search</text><text x="620" y="184">13. Kết nối OpenMetadata</text><text x="620" y="212">14. Reingest lineage</text><text x="620" y="240">15. Kiểm tra owner/class</text><text x="620" y="288" font-weight="700">Bằng chứng (Evidence)</text><text x="620" y="316">16. Khôi phục evidence index</text><text x="620" y="344">17. Kiểm tra payload hash</text><text x="620" y="372">18. Reconcile current</text><text x="620" y="400">19. Từ chối stale completion</text><text x="620" y="428">20. Ghi recovery result</text></g><text x="50" y="500" font-family="Arial" font-size="15" fill="#334155">Recovery gate: mỗi authority được verify trước khi current state hoặc kết quả phục hồi được công bố.</text><text x="50" y="570" font-family="Arial" font-size="15" fill="#1f2937">Chú giải: conceptual-only; hash là integrity check, không phải chữ ký, approval hay runtime proof.</text></svg>
