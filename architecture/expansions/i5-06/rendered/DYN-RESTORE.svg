<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" data-source-sha256="d2ad6451335234742d897dda1eabce64cecbbd8b48a7e44478af5d748cacea12" data-raw-sha256="cd58bce8be2540ae6b552622680edc915823786729edc4aa6401d88d90b4c160"><title id="title">Khôi phục theo authority — chỉ khái niệm (Authority restore — conceptual only)</title><desc id="desc">View kiến trúc tĩnh có nhãn tiếng Việt và văn bản thay thế theo đúng thứ tự quan hệ.</desc><rect width="1200" height="600" fill="#ffffff"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14213d">Khôi phục theo authority — chỉ khái niệm (Authority restore — conceptual only)</text><rect data-node="step-1" x="35" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">1. Tạo ranh giới trống</text><text x="47" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → awsConcept.evidenceStore</text><rect data-node="step-2" x="35" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="138" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">2. Khôi phục object</text><text x="47" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.lake</text><rect data-node="step-3" x="35" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">3. Đăng ký catalog</text><text x="47" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.lake</text><rect data-node="step-4" x="35" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">4. Công bố current pointer</text><text x="47" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.lake</text><rect data-node="step-5" x="35" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">5. Kiểm tra đọc table</text><text x="47" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.lake → awsConcept.evidenceStore</text><rect data-node="step-6" x="35" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">6. Khôi phục analytics authority</text><text x="47" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.compute</text><rect data-node="step-7" x="35" y="360" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="378" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">7. Hydrate query state</text><text x="47" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.compute</text><rect data-node="step-8" x="35" y="408" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">8. Khôi phục BI metadata</text><text x="47" y="444" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.bi</text><rect data-node="step-9" x="35" y="456" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="474" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">9. Chạy equivalence</text><text x="47" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.bi → awsConcept.evidenceStore</text><rect data-node="step-10" x="35" y="504" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="522" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">10. Ghi RTO/RPO</text><text x="47" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → operator</text><rect data-node="step-11" x="615" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">11. Khôi phục DB</text><text x="627" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.governance</text><rect data-node="step-12" x="615" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="138" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">12. Khôi phục search</text><text x="627" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.governance</text><rect data-node="step-13" x="615" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">13. Kết nối OpenMetadata</text><text x="627" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.governance</text><rect data-node="step-14" x="615" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">14. Reingest lineage</text><text x="627" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.lake → awsConcept.governance</text><rect data-node="step-15" x="615" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">15. Kiểm tra owner và classification</text><text x="627" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.governance → awsConcept.evidenceStore</text><rect data-node="step-16" x="615" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">16. Khôi phục evidence index</text><text x="627" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → awsConcept.evidenceStore</text><rect data-node="step-17" x="615" y="360" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="378" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">17. Kiểm tra hash payload</text><text x="627" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.evidenceStore</text><rect data-node="step-18" x="615" y="408" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="426" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">18. Reconcile current state</text><text x="627" y="444" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.lake</text><rect data-node="step-19" x="615" y="456" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="474" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">19. Từ chối completion stale</text><text x="627" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → operator</text><rect data-node="step-20" x="615" y="504" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="522" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">20. Ghi kết quả recovery</text><text x="627" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → operator</text><text x="40" y="580" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">Chú giải: số thứ tự do renderer tạo; quan hệ một chiều; failure/recovery giữ đúng trình tự.</text></svg>
