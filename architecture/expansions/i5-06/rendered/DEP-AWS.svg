<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Triển khai AWS — chỉ khái niệm và TBC</title><desc id="desc">Deployment hierarchy gồm access, compute, authority-state và private recovery state; không phải topology đã triển khai.</desc><rect width="1200" height="600" fill="#fff"/><text x="40" y="45" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Triển khai AWS — chỉ khái niệm và TBC</text><rect x="35" y="70" width="1130" height="470" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="55" y="103" font-family="Arial" font-size="18" fill="#102a43">Môi trường: aws-conceptual</text><g font-family="Arial" fill="#102a43"><rect x="70" y="135" width="290" height="320" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="92" y="170" font-size="18" font-weight="700">Ranh giới truy cập</text><rect x="100" y="210" width="230" height="90" rx="6" fill="#fff" stroke="#0369a1" stroke-width="3"/><text x="120" y="250" font-size="18">Cổng admission</text><text x="120" y="278" font-size="15">principal + budget</text><rect x="455" y="135" width="290" height="320" rx="8" fill="#ecfccb" stroke="#3f6212" stroke-width="3"/><text x="477" y="170" font-size="18" font-weight="700">Ranh giới tính toán</text><rect x="485" y="210" width="230" height="90" rx="6" fill="#fff" stroke="#3f6212" stroke-width="3"/><text x="505" y="250" font-size="18">Năng lực tính toán</text><text x="505" y="278" font-size="15">Compute capacity · BI</text><rect x="840" y="135" width="290" height="320" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><text x="862" y="170" font-size="18" font-weight="700">Authority và trạng thái</text><rect x="870" y="200" width="230" height="80" rx="6" fill="#fff" stroke="#92400e" stroke-width="3"/><text x="890" y="240" font-size="18">Object và catalog</text><rect x="870" y="305" width="230" height="115" rx="6" fill="#fdf2f8" stroke="#9d174d" stroke-width="3"/><text x="890" y="345" font-size="18">Trạng thái phục hồi riêng</text><text x="890" y="376" font-size="15">evidence index + hashes</text></g><g stroke="#374151" stroke-width="4" fill="none"><path d="M330 255 H485"/><path d="M715 255 H870"/></g><g font-family="Arial" font-size="15" fill="#111827"><text x="365" y="242">admit trước work</text><text x="750" y="242">read authority</text></g><text x="55" y="505" font-family="Arial" font-size="15" fill="#334155">Failure/recovery: stop admission → drain → checkpoint → stop compute → inventory residual state/cost.</text><text x="55" y="570" font-family="Arial" font-size="15" fill="#1f2937">Chú giải: containment là deployment hierarchy; TBC cho identity, network, backup và measured capacity.</text></svg>
