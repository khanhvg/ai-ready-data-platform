<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Vận hành office window — chỉ khái niệm</title><desc id="desc">Ba luồng open, readiness và close theo thứ tự; không chứng minh hosted runtime hay deployability.</desc><rect width="1200" height="600" fill="#fff"/><text x="40" y="43" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Vận hành office window — chỉ khái niệm</text><rect x="30" y="65" width="1140" height="475" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/><g font-family="Arial" font-size="18" fill="#102a43"><text x="50" y="100" font-weight="700">Mở (open)</text><text x="50" y="130">1. Yêu cầu mở</text><text x="50" y="158">2. Kiểm tra ngân sách và capacity</text><text x="50" y="186">3. Khởi động compute</text><text x="50" y="214">4. Khôi phục và hydrate</text><text x="50" y="242">5. Vượt readiness</text><text x="50" y="270">6. Mở endpoint</text><text x="50" y="320" font-weight="700">Kiểm tra sẵn sàng (Readiness)</text><text x="50" y="350">7. Probe data authority</text><text x="50" y="378">8. Probe metadata authority</text><text x="50" y="406">9. Probe đường BI</text><text x="620" y="100">10. So sánh tương đương</text><text x="620" y="128">11. Ready có điều kiện</text><text x="620" y="180" font-weight="700">Đóng (close)</text><text x="620" y="210">12. Dừng admission</text><text x="620" y="238">13. Drain công việc</text><text x="620" y="266">14. Checkpoint authority</text><text x="620" y="294">15. Dừng compute</text><text x="620" y="322">16. Kiểm kê state/cost</text></g><text x="50" y="500" font-family="Arial" font-size="15" fill="#334155">Trust/cost boundary: readiness trước expose; stop admission trước drain; residual state luôn được inventory.</text><text x="50" y="570" font-family="Arial" font-size="15" fill="#1f2937">Chú giải: conceptual-only; identity, network, measured capacity, RTO/RPO và pricing đều TBC.</text></svg>
