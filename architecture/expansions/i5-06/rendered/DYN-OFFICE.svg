<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" data-source-sha256="e02e9b64e49c14b288b3bef2c0a71215c9ecea1230b44493a8f173c84fc73dd7" data-raw-sha256="dc17212bfc40a359129417d343b271bf0abed96922496eb744f7bfcabda2454c"><title id="title">Vận hành office window — chỉ khái niệm (Office window — conceptual only)</title><desc id="desc">View kiến trúc tĩnh có nhãn tiếng Việt và văn bản thay thế theo đúng thứ tự quan hệ.</desc><rect width="1200" height="600" fill="#ffffff"/><text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14213d">Vận hành office window — chỉ khái niệm (Office window — conceptual only)</text><rect data-node="step-1" x="35" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="90" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">1. Yêu cầu mở</text><text x="47" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → awsConcept.admission</text><rect data-node="step-2" x="35" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">2. Kiểm tra ngân sách và capacity</text><text x="47" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.admission → awsConcept.compute</text><rect data-node="step-3" x="35" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">3. Khởi động compute</text><text x="47" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.admission → awsConcept.compute</text><rect data-node="step-4" x="35" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">4. Khôi phục và hydrate</text><text x="47" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.compute → awsConcept.lake</text><rect data-node="step-5" x="35" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">5. Vượt readiness</text><text x="47" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.compute → awsConcept.evidenceStore</text><rect data-node="step-6" x="35" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">6. Mở endpoint</text><text x="47" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.compute → awsConcept.bi</text><rect data-node="step-7" x="35" y="360" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="378" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">7. Probe data authority</text><text x="47" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.lake</text><rect data-node="step-8" x="35" y="408" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="426" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">8. Probe metadata authority</text><text x="47" y="444" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.governance</text><rect data-node="step-9" x="35" y="456" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="474" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">9. Probe đường BI</text><text x="47" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.bi</text><rect data-node="step-10" x="35" y="504" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="47" y="522" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">10. So sánh tương đương</text><text x="47" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → awsConcept.compute</text><rect data-node="step-11" x="615" y="72" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="90" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">11. Tuyên bố ready có điều kiện</text><text x="627" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.evidenceStore → operator</text><rect data-node="step-12" x="615" y="120" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">12. Dừng admission</text><text x="627" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">operator → awsConcept.admission</text><rect data-node="step-13" x="615" y="168" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">13. Drain công việc</text><text x="627" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.admission → awsConcept.compute</text><rect data-node="step-14" x="615" y="216" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">14. Checkpoint authority</text><text x="627" y="252" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.compute → awsConcept.lake</text><rect data-node="step-15" x="615" y="264" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="282" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">15. Dừng compute</text><text x="627" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.admission → awsConcept.compute</text><rect data-node="step-16" x="615" y="312" width="550" height="42" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="627" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14213d">16. Kiểm kê trạng thái và cost còn lại</text><text x="627" y="348" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">awsConcept.compute → awsConcept.evidenceStore</text><text x="40" y="580" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">Chú giải: số thứ tự do renderer tạo; quan hệ một chiều; failure/recovery giữ đúng trình tự.</text></svg>
