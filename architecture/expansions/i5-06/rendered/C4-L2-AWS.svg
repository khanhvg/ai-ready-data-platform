mily="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">Truy cập BI</text><text x="75" y="383" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">AWS conceptual only</text><rect data-node="c4-5" x="435" y="295" width="330" height="145" rx="9" fill="#e0f2fe" stroke="#075985" stroke-width="3"/><text x="455" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">Quản trị metadata</text><text x="455" y="383" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">AWS conceptual only</text><rect data-node="c4-6" x="815" y="295" width="330" height="145" rx="9" fill="#e0f2fe" stroke="#075985" stroke-width="3"/><text x="835" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">Bằng chứng phục hồi</text><text x="835" y="383" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">AWS conceptual only</text><text x="55" y="535" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">Quan hệ: admission → compute → lake/BI; governance đối chiếu lake; evidence báo operator.</text><text x="55" y="570" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#14213d">Giới hạn: không phải runtime, tài khoản, tài nguyên, giá hay bằng chứng triển khai.</text></svg>
