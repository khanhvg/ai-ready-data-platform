<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc phân tích AWS — chỉ khái niệm</title><desc id="desc">View container cho audience kiến trúc, bảo mật và FinOps; mô tả ranh giới, authority và tám bridge conceptual-only, không phải runtime.</desc><rect width="1200" height="600" fill="#ffffff"/><text x="40" y="45" font-family="Arial" font-size="24" font-weight="700" fill="#14213d">Kiến trúc phân tích AWS — chỉ khái niệm (Conceptual only)</text><rect x="35" y="70" width="1130" height="450" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="55" y="102" font-family="Arial" font-size="15" fill="#334155">Ranh giới AWS conceptual — không có account, resource, current price hay deployability claim</text><g font-family="Arial" font-size="18" fill="#102a43" stroke="#1d4ed8" stroke-width="3"><rect x="70" y="145" width="280" height="92" rx="8" fill="#dbeafe"/><rect x="460" y="145" width="280" height="92" rx="8" fill="#dbeafe"/><rect x="850" y="145" width="280" height="92" rx="8" fill="#dbeafe"/><rect x="70" y="330" width="280" height="92" rx="8" fill="#dcfce7"/><rect x="460" y="330" width="280" height="92" rx="8" fill="#dcfce7"/><rect x="850" y="330" width="280" height="92" rx="8" fill="#dcfce7"/></g><g font-family="Arial" font-size="18" fill="#102a43"><text x="92" y="180">Cổng ngân sách</text><text x="92" y="207" font-size="15">admission / cost boundary</text><text x="482" y="180">Năng lực tính toán</text><text x="482" y="207" font-size="15">ClickHouse + compute mapping</text><text x="872" y="180">Object và catalog</text><text x="872" y="207" font-size="15">Object + catalog mapping</text><text x="92" y="365">Truy cập BI</text><text x="92" y="392" font-size="15">Superset mapping</text><text x="482" y="365">Quản trị metadata</text><text x="482" y="392" font-size="15">OpenMetadata mapping</text><text x="872" y="365">Bằng chứng phục hồi</text><text x="872" y="392" font-size="15">closed index + reconcile</text></g><g stroke="#374151" stroke-width="4" fill="none"><path d="M350 190 H460"/><path d="M740 190 H850"/><path d="M990 237 V330"/><path d="M850 376 H740"/><path d="M460 376 H350"/></g><g font-family="Arial" font-size="15" fill="#111827"><text x="365" y="178">cho phép</text><text x="755" y="178">đọc authority</text><text x="1000" y="288">lineage</text><text x="755" y="363">reconcile</text><text x="365" y="363">phục vụ</text></g><rect x="35" y="540" width="1130" height="35" fill="#e2e8f0"/><text x="50" y="564" font-family="Arial" font-size="15" fill="#1f2937">Chú giải: hộp xanh = capability conceptual; đường nối = relation có nhãn; bridge: conceptual-only.</text></svg>
