contractId: promotion-trust-v1
schemaVersion: promotion-trust-v1
sources:
  - sourceId: mart_promotion_effectiveness
    grain: [promo_name, channel]
    order: [promo_name, channel]
    filter: full-input
    numerator: total_discount_amount
    denominator: gross_revenue
    calculation: ratio-of-sums
    limitation: no shared key with fulfillment, returns, or data-quality grains
  - sourceId: mart_fulfillment_performance
    grain: [carrier, region_name]
    order: [carrier, region_name]
    filter: full-input
    numerator: on_time_count
    denominator: shipment_count
    calculation: ratio-of-sums; lead time weighted by non-in-transit shipments
    limitation: no shared key with promotion, returns, or data-quality grains
  - sourceId: mart_returns_analysis
    grain: [reason, category_name, region_name]
    order: [reason, category_name, region_name]
    filter: full-input
    numerator: total_refund_amount
    denominator: return_count
    calculation: ratio-of-sums
    limitation: no shared key with promotion, fulfillment, or data-quality grains
  - sourceId: mart_data_quality
    grain: [scenario]
    order: [scenario]
    filter: full-input
    numerator: row_count
    denominator: none
    calculation: independent scenario count
    limitation: aggregate diagnostic only; no cross-grain attribution
assertions:
  - PTV1-GRAIN-PROMOTION
  - PTV1-GRAIN-FULFILLMENT
  - PTV1-GRAIN-RETURNS
  - PTV1-GRAIN-DATA-QUALITY
  - PTV1-HEADLINE-SUFFICIENT
  - PTV1-NO-CROSS-GRAIN-JOIN
  - PTV1-NO-ATTRIBUTION
  - PTV1-DECISION-INSUFFICIENT-EVIDENCE
expectedControlledFailure: PROMOTION_HEADLINE_INSUFFICIENT
decision: insufficient-evidence
reason: no-common-grain
