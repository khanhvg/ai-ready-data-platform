  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "ContractVersion": {
        "name": "X-Learning-Contract-Version",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "const": "learning-platform-v1"
        }
      }
    },
    "schemas": {
      "Problem": {
        "$ref": "./learning-platform-problem-details-v1.schema.json"
      },
      "CreateWorkspaceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId",
          "expectedRevision",
          "parameters"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedRevision": {
            "type": "integer",
            "minimum": 0
          },
          "parameters": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          }
        }
      },
      "StartWorkspaceOperationRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId",
          "expectedRevision",
          "commandId",
          "arguments"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedRevision": {
            "type": "integer",
            "minimum": 0
          },
          "commandId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "arguments": {
            "type": "array",
            "maxItems": 32,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          }
        }
      },
      "ResetWorkspaceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId",
          "expectedRevision"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedRevision": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "VerifyWorkspaceRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId",
          "expectedRevision",
          "evidenceId"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedRevision": {
            "type": "integer",
            "minimum": 0
          },
          "evidenceId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          }
        }
      },
      "QueryDataProductRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId",
          "queryId",
          "metrics",
          "dimensions"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "queryId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "metrics": {
            "type": "array",
            "minItems": 1,
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
            }
          },
          "dimensions": {
            "type": "array",
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
            }
          }
        }
      },
      "Lesson": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "lessonId",
          "title"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "lessonId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          }
        }
      },
      "Progress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "lessonId",
          "state",
          "revision"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "lessonId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "state": {
            "enum": [
              "not-started",
              "in-progress",
              "verified",
              "completed"
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Workspace": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "workspaceId",
          "state",
          "revision"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "workspaceId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "state": {
            "enum": [
              "provisioning",
              "ready",
              "running",
              "verified",
              "failed"
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Operation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "operationId",
          "state"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "operationId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "state": {
            "enum": [
              "accepted",
              "running",
              "succeeded",
              "failed"
            ]
          }
        }
      },
      "OperationAccepted": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "operationId",
          "state"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "operationId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "state": {
            "const": "accepted"
          }
