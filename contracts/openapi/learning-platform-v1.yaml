  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "ContractVersion": {
        "name": "X-Learning-Contract-Version",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "const": "learning-platform-v1"
        }
      }
    },
    "schemas": {
      "VersionedRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "requestId"
        ],
        "properties": {
          "schemaVersion": {
            "const": "learning-platform-v1"
          },
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Problem": {
        "$ref": "./learning-platform-problem-details-v1.schema.json"
      }
    },
    "responses": {
      "Success": {
        "description": "Versioned success response",
        "headers": {
          "X-Learning-Contract-Version": {
            "required": true,
            "schema": {
              "type": "string",
              "const": "learning-platform-v1"
            }
          },
          "X-Correlation-ID": {
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "schemaVersion",
                "result"
              ],
              "properties": {
                "schemaVersion": {
                  "const": "learning-platform-v1"
                },
                "result": {
                  "type": "object"
                }
              }
            }
          }
        }
      },
      "Problem": {
        "description": "RFC 9457 problem response",
        "headers": {
          "X-Learning-Contract-Version": {
            "required": true,
            "schema": {
              "type": "string",
              "const": "learning-platform-v1"
            }
          },
          "X-Correlation-ID": {
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        }
      }
    }
  }
