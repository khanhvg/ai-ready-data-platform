name: retail_pipeline
version: "1.0.0"
config-version: 2

profile: retail_pipeline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  retail_pipeline:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ["intermediate"]
    core:
      +materialized: table
      +schema: core
      +tags: ["core"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
    quarantine:
      +materialized: table
      +schema: quarantine
      +tags: ["quarantine", "demo-evidence"]
    curated:
      +materialized: table
      +schema: curated
      +tags: ["accepted", "demo-evidence"]
    products:
      +materialized: table
      +schema: products
      +tags: ["ai-ready-product", "demo-evidence"]
