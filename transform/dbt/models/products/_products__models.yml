version: 2

models:
  - name: ai_ready_customer_product
    description: >
      Synthetic, governed AI-ready customer-order product at accepted-order
      grain. Source customer and order identifiers are pseudonymized and raw
      email is excluded. This product is intentionally outside the canonical
      eleven legacy business-mart publication inventory.
    meta:
      owner: data-platform-demo
      contains_raw_email: false
      access_classification: synthetic-pii-derived
      policy_asset_id: ai-ready-customer-product
      publication_inventory: additive-noncanonical
    columns:
      - name: order_key
        description: Deterministic pseudonymous accepted-order identifier.
        tests: [not_null, unique]
      - name: customer_key
        description: Deterministic pseudonymous customer identifier.
        tests: [not_null]
      - name: email_pseudonym
        description: >
          Nullable deterministic one-way pseudonym derived from synthetic
          customers.email; no raw email value or domain is published.
      - name: loyalty_tier
        tests: [not_null]
      - name: accepted_order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled', 'returned', 'pending']
