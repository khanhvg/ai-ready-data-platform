version: 2

models:
  - name: mart_daily_revenue
    description: Daily completed-order revenue, order count, and average order value.
    columns:
      - name: order_date
        tests: [not_null, unique]

  - name: mart_top_products
    description: Product-level units sold and revenue, ranked for a top-N demo view.
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: mart_customer_cohorts
    description: Signup-month cohorts by loyalty tier with customer count and lifetime revenue.
    columns:
      - name: cohort_month
        tests: [not_null]
