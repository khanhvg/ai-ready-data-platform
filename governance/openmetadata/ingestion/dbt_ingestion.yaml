source:
  type: dbt
  serviceName: retail_duckdb
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        # Must be absolute: OM 1.6.5's LocalReader resolves relative dbt config
        # paths against its own package directory, not the invoking CWD.
        dbtCatalogFilePath: ${REPO_ROOT}/transform/dbt/target/catalog.json
        dbtManifestFilePath: ${REPO_ROOT}/transform/dbt/target/manifest.json
      dbtUpdateDescriptions: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OPENMETADATA_JWT_TOKEN}"
