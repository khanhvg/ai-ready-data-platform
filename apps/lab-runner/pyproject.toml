[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-lab-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
