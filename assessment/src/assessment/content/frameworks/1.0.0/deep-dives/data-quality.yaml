schema_version: 1.0.0
id: data-quality
title: Data quality, reliability, and remediation
capability_ids: [QUA]
duration_minutes: 90
evidence_guidance: Use synthetic or redacted contracts, rule results, incident records, and ownership evidence; never request customer records or credentials.
linked_recommendation_ids: [R-QUALITY]
questions:
  - {id: DQ-01, text: "How are critical datasets selected for profiling and quality coverage?", anchors: {"0": "No critical datasets are selected or profiled.", "1": "Ad hoc profiling occurs after visible failures.", "2": "Named critical datasets receive repeatable baseline profiling.", "3": "Risk-based profiling is automated and reviewed for every critical dataset.", "4": "Profiling coverage and emerging risks drive continuously improved controls."}, evidence_guidance: "Review a redacted critical-dataset inventory and synthetic profiling result.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-02, text: "How are producer and consumer data contracts defined and enforced?", anchors: {"0": "No explicit data contracts or acceptance criteria exist.", "1": "Teams rely on informal field expectations and manual checks.", "2": "Critical interfaces have versioned schemas and basic validation.", "3": "Contracts are enforced before acceptance with owned compatibility decisions.", "4": "Contract performance and consumer impact continuously improve release policy."}, evidence_guidance: "Review a redacted versioned contract and synthetic pass and fail results.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-03, text: "How are business-validity rules distinguished from technical schema checks?", anchors: {"0": "No business-validity or schema checks are defined.", "1": "Checks are mixed in ad hoc scripts without ownership.", "2": "Technical and business rules are separately named for critical data.", "3": "Both rule classes have owners severity and enforcement boundaries.", "4": "Rule effectiveness is measured against incidents and business outcomes."}, evidence_guidance: "Review a synthetic rule catalog showing technical and business classifications.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-04, text: "How are quality rule owners and approvers made accountable?", anchors: {"0": "Rules have no accountable owners or approvers.", "1": "Ownership is inferred from team membership.", "2": "Critical rules name an owner and review cadence.", "3": "Owners approve severity thresholds exceptions and remediation evidence.", "4": "Ownership effectiveness is measured and reassigned when outcomes degrade."}, evidence_guidance: "Review a redacted rule register with owner approver and review date.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-05, text: "How are rule thresholds and severity levels calibrated?", anchors: {"0": "No thresholds or severity definitions exist.", "1": "Fixed thresholds are chosen without recorded rationale.", "2": "Critical thresholds have documented rationale and severity.", "3": "Thresholds are calibrated from synthetic tests and approved risk tolerances.", "4": "Observed outcomes trigger governed recalibration without hiding failures."}, evidence_guidance: "Review redacted threshold rationale and synthetic calibration results.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-06, text: "How are failed records separated from accepted data?", anchors: {"0": "Failed records continue into accepted products.", "1": "Failures are logged but exclusion is inconsistent.", "2": "Critical failures enter a defined quarantine boundary.", "3": "Quarantine and accepted sets are complete disjoint and tested.", "4": "Partition evidence and exception trends drive preventive improvement."}, evidence_guidance: "Review synthetic accepted and quarantine counts with disjointness proof.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-07, text: "How are quality exceptions approved and expired?", anchors: {"0": "Failures are bypassed without recorded exceptions.", "1": "Temporary exceptions exist in messages or tickets only.", "2": "Critical exceptions name an approver reason and expiry.", "3": "Expired exceptions fail closed and are independently reviewed.", "4": "Exception patterns reduce through measured root-cause improvement."}, evidence_guidance: "Review a redacted exception record with approval expiry and outcome.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-08, text: "How are quality results retained with reproducible inputs?", anchors: {"0": "Quality results are not retained.", "1": "Screenshots or logs exist without input identity.", "2": "Results retain rule and dataset version identifiers.", "3": "Results bind input rule environment and output digests.", "4": "Independent rebuilds reproduce declared results and discrepancies are governed."}, evidence_guidance: "Review a synthetic result manifest with rule input and output digests.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-09, text: "How are freshness and completeness expectations monitored?", anchors: {"0": "Freshness and completeness are not measured.", "1": "Consumers report late or incomplete data manually.", "2": "Critical products have basic freshness and completeness targets.", "3": "Targets are monitored with owned alerts and escalation.", "4": "Service outcomes and demand patterns continuously refine targets."}, evidence_guidance: "Review redacted service objectives and synthetic alert history.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-10, text: "How are duplicate and referential-integrity failures controlled?", anchors: {"0": "Duplicate and relationship failures are not checked.", "1": "Teams remove obvious duplicates during incidents.", "2": "Critical keys and relationships have repeatable checks.", "3": "Failures block acceptance or follow approved exception paths.", "4": "Preventive producer controls reduce recurring integrity failures."}, evidence_guidance: "Review synthetic duplicate and referential test cases and outcomes.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-11, text: "How are quality incidents detected and triaged?", anchors: {"0": "Quality incidents are discovered by consumers.", "1": "Detection exists for isolated datasets without triage rules.", "2": "Critical failures create owned alerts with severity.", "3": "Triage follows tested impact escalation and communication paths.", "4": "Incident learning improves detection coverage and response performance."}, evidence_guidance: "Review a redacted quality incident timeline and synthetic alert.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-12, text: "How are quality incidents traced to affected products and AI uses?", anchors: {"0": "Affected products and AI uses cannot be identified.", "1": "Impact is reconstructed manually after incidents.", "2": "Critical products and uses are recorded for key datasets.", "3": "Lineage-based impact analysis informs triage and notification.", "4": "Impact evidence drives proactive simulations and control investment."}, evidence_guidance: "Review redacted impact analysis linked to synthetic lineage.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY, R-LINEAGE]}
  - {id: DQ-13, text: "How are remediation actions assigned and verified?", anchors: {"0": "Failures have no tracked remediation.", "1": "Teams assign informal tasks without verification.", "2": "Critical remediation names an owner target and evidence.", "3": "Closure requires verified correction and recurrence prevention.", "4": "Remediation lead time and recurrence guide systemic investment."}, evidence_guidance: "Review a redacted remediation record with verification evidence.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-14, text: "How are recurring defects analyzed for root causes?", anchors: {"0": "Recurring defects are repeatedly patched.", "1": "Root causes are discussed without consistent records.", "2": "Critical recurring failures receive structured cause analysis.", "3": "Preventive actions are verified across producer and platform boundaries.", "4": "Cross-product patterns influence standards architecture and funding."}, evidence_guidance: "Review a redacted root-cause analysis and preventive action result.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-15, text: "How are quality controls tested before release?", anchors: {"0": "Quality controls are released without tests.", "1": "Rule logic is manually spot-checked.", "2": "Critical rules have deterministic positive and negative tests.", "3": "Release gates verify rules thresholds quarantine and exceptions.", "4": "Mutation and failure-injection tests continuously challenge controls."}, evidence_guidance: "Review synthetic positive negative and boundary test results.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-16, text: "How are rule changes reviewed for downstream impact?", anchors: {"0": "Rule changes occur without impact review.", "1": "Review depends on individual knowledge.", "2": "Critical changes identify known consumers and compatibility.", "3": "Lineage and contract evidence support approved change decisions.", "4": "Observed impact accuracy improves change policy and automation."}, evidence_guidance: "Review a redacted rule change with consumer and lineage impact.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY, R-LINEAGE]}
  - {id: DQ-17, text: "How are quality measures communicated to product consumers?", anchors: {"0": "Consumers receive no quality status.", "1": "Status is shared manually during failures.", "2": "Critical products publish understandable quality measures.", "3": "Measures include limitations freshness exceptions and owner contacts.", "4": "Consumer outcomes and feedback continuously improve measures."}, evidence_guidance: "Review a redacted product quality summary and limitation statement.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-18, text: "How is quality coverage measured across critical fields and products?", anchors: {"0": "Quality coverage is unknown.", "1": "Teams count tests without relating them to risk.", "2": "Critical fields and products have recorded rule coverage.", "3": "Risk-weighted coverage gaps drive accountable roadmap actions.", "4": "Coverage effectiveness is correlated with incidents and outcomes."}, evidence_guidance: "Review a redacted risk-weighted coverage matrix.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY]}
  - {id: DQ-19, text: "How are quality costs and remediation capacity planned?", anchors: {"0": "Quality cost and capacity are not planned.", "1": "Capacity is added reactively after failures.", "2": "Critical remediation demand and ownership are estimated.", "3": "Roadmaps balance prevention detection remediation and business impact.", "4": "Outcome and cost measures continuously optimize investment."}, evidence_guidance: "Review a redacted remediation backlog and capacity decision.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY, R-OWNERSHIP]}
  - {id: DQ-20, text: "How is end-to-end quality control effectiveness reviewed?", anchors: {"0": "Control effectiveness is not reviewed.", "1": "Teams report test pass counts without outcome analysis.", "2": "Critical controls receive periodic evidence-based review.", "3": "Independent review covers design operation exceptions and outcomes.", "4": "Review findings measurably improve reliability and risk posture."}, evidence_guidance: "Review a redacted control-effectiveness assessment and action plan.", duration_minutes: 4, linked_recommendation_ids: [R-QUALITY, R-GOVERNANCE]}
