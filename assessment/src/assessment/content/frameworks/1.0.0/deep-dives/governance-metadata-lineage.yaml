schema_version: 1.0.0
id: governance-metadata-lineage
title: Governance, metadata, ownership, and lineage
capability_ids: [GOV, LIN]
duration_minutes: 120
evidence_guidance: Use redacted decision records, glossaries, ownership registers, catalog extracts, and synthetic lineage; never request live credentials or customer records.
linked_recommendation_ids: [R-OWNERSHIP, R-GOVERNANCE, R-LINEAGE]
questions:
  - {id: GL-01, text: "How are accountable owners assigned to critical data products?", anchors: {"0": "Critical products have no accountable owners.", "1": "Ownership is inferred from teams or project contacts.", "2": "Critical products name accountable owners and delegates.", "3": "Owners exercise documented decision rights and review outcomes.", "4": "Ownership effectiveness and capacity are continuously measured and improved."}, evidence_guidance: "Review a redacted ownership register with decision rights.", duration_minutes: 4, linked_recommendation_ids: [R-OWNERSHIP]}
  - {id: GL-02, text: "How are stewardship responsibilities distinguished from accountability?", anchors: {"0": "Stewardship and accountability are not defined.", "1": "People perform stewardship informally without decision authority.", "2": "Critical domains distinguish accountable owners and operating stewards.", "3": "Escalation handoffs and measures are documented and exercised.", "4": "Role effectiveness is optimized using outcome and workload evidence."}, evidence_guidance: "Review a redacted role matrix and escalation example.", duration_minutes: 4, linked_recommendation_ids: [R-OWNERSHIP]}
  - {id: GL-03, text: "How are governance decisions recorded and made discoverable?", anchors: {"0": "Governance decisions are not retained.", "1": "Decisions remain in meetings messages or personal notes.", "2": "Critical decisions use a searchable versioned register.", "3": "Records bind rationale approver scope evidence and review date.", "4": "Decision outcomes and precedent continuously improve policy."}, evidence_guidance: "Review a redacted decision record with rationale and evidence.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-04, text: "How are policy exceptions approved monitored and expired?", anchors: {"0": "Policy exceptions are invisible or permanent.", "1": "Exceptions are tracked informally without expiry.", "2": "Critical exceptions name approver rationale and expiry.", "3": "Monitoring and fail-closed expiry are tested and reported.", "4": "Exception trends reduce through policy and platform improvement."}, evidence_guidance: "Review a redacted exception lifecycle record.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-05, text: "How are business terms defined and reconciled across domains?", anchors: {"0": "Shared business terms are not defined.", "1": "Teams maintain conflicting local definitions.", "2": "Critical terms have owned definitions and domain scope.", "3": "Conflicts follow governed reconciliation and versioning.", "4": "Usage and outcome evidence continuously improve semantic clarity."}, evidence_guidance: "Review redacted glossary entries and one resolved conflict.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-06, text: "How are business terms connected to physical and logical data?", anchors: {"0": "Terms are disconnected from data assets.", "1": "Connections exist in documentation without verification.", "2": "Critical terms link to named products and fields.", "3": "Links are validated through catalog workflows and ownership review.", "4": "Coverage and change impact continuously improve semantic mappings."}, evidence_guidance: "Review a redacted term-to-product and field mapping.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE, R-LINEAGE]}
  - {id: GL-07, text: "How are critical data assets inventoried and classified?", anchors: {"0": "Critical assets are not inventoried.", "1": "Partial inventories are manually maintained.", "2": "Critical assets have stable identities owners and classifications.", "3": "Inventory completeness and freshness are automatically measured.", "4": "Risk and usage evidence continuously refine criticality."}, evidence_guidance: "Review a redacted critical-asset inventory and coverage measure.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-08, text: "How is technical metadata captured and kept current?", anchors: {"0": "Technical metadata is unavailable.", "1": "Schema details are captured manually and become stale.", "2": "Critical assets receive repeatable technical metadata collection.", "3": "Freshness failures alert owners and block unsupported claims.", "4": "Metadata quality measures optimize collection and remediation."}, evidence_guidance: "Review a redacted technical metadata extract with freshness status.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-09, text: "How is business metadata quality reviewed?", anchors: {"0": "Business metadata quality is not reviewed.", "1": "Completeness depends on individual initiative.", "2": "Critical metadata has required fields and owners.", "3": "Quality and freshness measures drive governed remediation.", "4": "Consumer outcomes continuously refine required metadata."}, evidence_guidance: "Review redacted metadata quality results and remediation.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-10, text: "How are logical and physical asset identities kept distinct?", anchors: {"0": "Logical and physical identities are conflated.", "1": "Teams distinguish them inconsistently in documentation.", "2": "Critical logical and physical assets use stable separate identities.", "3": "Mappings are explicit validated and do not fabricate equivalence.", "4": "Identity reconciliation is measured and governed across platforms."}, evidence_guidance: "Review a redacted logical-to-physical mapping and limitations.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-11, text: "How is source-to-product technical lineage captured?", anchors: {"0": "Source-to-product lineage is unavailable.", "1": "Lineage is reconstructed manually for incidents.", "2": "Critical transformation paths have repeatable lineage capture.", "3": "Observed lineage covers source transformations and published products.", "4": "Coverage and accuracy are continuously tested against runtime evidence."}, evidence_guidance: "Review synthetic source-to-product lineage with stable identities.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-12, text: "How is business-process lineage represented?", anchors: {"0": "Business-process lineage is not represented.", "1": "Process context exists only in narrative documents.", "2": "Critical products link to named processes and decisions.", "3": "Process and technical lineage support joined impact analysis.", "4": "Outcome evidence continuously refines process dependencies."}, evidence_guidance: "Review a redacted process-to-product dependency example.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-13, text: "How is lineage coverage measured for critical paths?", anchors: {"0": "Lineage coverage is unknown.", "1": "Teams count captured assets without critical-path scope.", "2": "Critical paths have defined source and product coverage measures.", "3": "Gaps have owners target dates and explicit limitations.", "4": "Coverage effectiveness is validated through change and incidents."}, evidence_guidance: "Review a redacted critical-lineage coverage measure.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-14, text: "How is lineage freshness and accuracy validated?", anchors: {"0": "Lineage freshness and accuracy are not checked.", "1": "Obvious errors are corrected after user reports.", "2": "Critical lineage has periodic freshness and accuracy review.", "3": "Automated reconciliation detects stale missing or impossible edges.", "4": "Validation outcomes continuously improve collection and identity rules."}, evidence_guidance: "Review synthetic lineage validation results including a rejected edge.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-15, text: "How is lineage used during change-impact analysis?", anchors: {"0": "Changes proceed without lineage impact analysis.", "1": "Experts manually identify likely consumers.", "2": "Critical changes consult recorded downstream lineage.", "3": "Approvals require reviewed impact scope and consumer actions.", "4": "Observed change outcomes improve impact prediction and policy."}, evidence_guidance: "Review a redacted change record with lineage-derived impact.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-16, text: "How is lineage used during incidents and recovery?", anchors: {"0": "Incident response cannot use lineage.", "1": "Lineage is reconstructed manually during incidents.", "2": "Critical incidents consult available upstream and downstream paths.", "3": "Runbooks use validated lineage for containment and recovery.", "4": "Incident outcomes continuously test and improve lineage utility."}, evidence_guidance: "Review a redacted incident timeline referencing synthetic lineage.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE]}
  - {id: GL-17, text: "How are metadata and lineage changes versioned?", anchors: {"0": "Metadata and lineage changes are not versioned.", "1": "Current state is retained without reliable history.", "2": "Critical changes retain versions and responsible actors.", "3": "Versions bind source configuration and reviewed change evidence.", "4": "Historical comparison supports reproducibility and control optimization."}, evidence_guidance: "Review redacted metadata versions and one change diff.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE, R-REPRODUCIBILITY]}
  - {id: GL-18, text: "How are metadata connectors and collectors governed?", anchors: {"0": "Collectors operate without governance.", "1": "Connector ownership and scope are implicit.", "2": "Critical collectors have owners scope and version records.", "3": "Access failure behavior and output quality are tested.", "4": "Connector outcomes drive standardized resilient collection patterns."}, evidence_guidance: "Review redacted collector configuration ownership and test evidence.", duration_minutes: 4, linked_recommendation_ids: [R-LINEAGE, R-GOVERNANCE]}
  - {id: GL-19, text: "How are governance obligations linked to enforceable controls?", anchors: {"0": "Obligations are disconnected from controls.", "1": "Policies name intentions without control mappings.", "2": "Critical obligations map to named owners and controls.", "3": "Mappings include evidence frequency exceptions and effectiveness.", "4": "Outcomes continuously refine obligation and control design."}, evidence_guidance: "Review a redacted obligation-to-control mapping.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-20, text: "How is governance control effectiveness measured?", anchors: {"0": "Governance effectiveness is not measured.", "1": "Activity counts substitute for control outcomes.", "2": "Critical controls have basic outcome measures.", "3": "Independent review evaluates design operation exceptions and results.", "4": "Measured effectiveness drives policy architecture and funding decisions."}, evidence_guidance: "Review a redacted effectiveness review and accountable actions.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE]}
  - {id: GL-21, text: "How are data product contracts connected to catalog metadata?", anchors: {"0": "Product contracts are absent from the catalog.", "1": "Links are manually documented and frequently stale.", "2": "Critical products link current contracts and schema identities.", "3": "Release workflows validate contract metadata and lineage together.", "4": "Consumer outcomes continuously refine contract discoverability."}, evidence_guidance: "Review a redacted product entry linked to a versioned contract.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE, R-LINEAGE]}
  - {id: GL-22, text: "How are AI dataset approved uses and limitations cataloged?", anchors: {"0": "AI dataset uses and limitations are not recorded.", "1": "Use expectations exist in project documents only.", "2": "Critical AI datasets state approved uses owners and limitations.", "3": "Catalog workflows review purpose evidence risk and expiry.", "4": "Observed use and outcome evidence continuously refine approvals."}, evidence_guidance: "Review a redacted AI dataset entry with approved use and limitations.", duration_minutes: 4, linked_recommendation_ids: [R-GOVERNANCE, R-AI-OPERATING]}
  - {id: GL-23, text: "How is reproducibility provenance linked to published products?", anchors: {"0": "Published products lack reproducibility provenance.", "1": "Code references exist without complete input identity.", "2": "Critical products record versioned code inputs and contracts.", "3": "Immutable manifests bind environment output and lineage evidence.", "4": "Independent rebuild outcomes continuously validate provenance quality."}, evidence_guidance: "Review a synthetic product manifest and rebuild digest.", duration_minutes: 4, linked_recommendation_ids: [R-REPRODUCIBILITY, R-LINEAGE]}
  - {id: GL-24, text: "How is the governance metadata and lineage roadmap made accountable?", anchors: {"0": "No accountable roadmap exists.", "1": "Improvement ideas exist without owners or measures.", "2": "Critical gaps have sequenced owners and target outcomes.", "3": "Roadmap decisions use risk dependency capacity and evidence.", "4": "Measured outcomes continuously reprioritize systemic improvements."}, evidence_guidance: "Review a redacted roadmap with owners dependencies and success measures.", duration_minutes: 4, linked_recommendation_ids: [R-OWNERSHIP, R-GOVERNANCE, R-LINEAGE]}
