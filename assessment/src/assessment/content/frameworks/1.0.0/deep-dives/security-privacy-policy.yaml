schema_version: 1.0.0
id: security-privacy-policy
title: Security, privacy, and policy enforcement
capability_ids: [SEC, GOV]
duration_minutes: 90
evidence_guidance: Use redacted classifications, policies, access decisions, audit records, and synthetic tests; never request credentials, secrets, or raw customer data.
linked_recommendation_ids: [R-PRIVACY, R-SECURITY, R-GOVERNANCE]
questions:
  - {id: SP-01, text: "How are sensitive and regulated fields classified?", anchors: {"0": "Sensitive fields are not classified.", "1": "Classification depends on individual knowledge or naming.", "2": "Critical fields have owned repeatable classifications.", "3": "Classification is validated and drives enforceable controls.", "4": "Discovery outcomes and incidents continuously improve classification."}, evidence_guidance: "Review a redacted classification entry and synthetic field example.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY]}
  - {id: SP-02, text: "How are approved purposes recorded for sensitive data use?", anchors: {"0": "Sensitive use has no recorded approved purpose.", "1": "Purpose is implied by project membership.", "2": "Critical uses record purpose owner and scope.", "3": "Purpose approval binds data users controls and review date.", "4": "Observed use and outcomes continuously refine purpose policy."}, evidence_guidance: "Review a redacted purpose approval without customer data.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-GOVERNANCE]}
  - {id: SP-03, text: "How is data minimization applied to products and AI datasets?", anchors: {"0": "Products include data without minimization review.", "1": "Teams remove obvious fields manually.", "2": "Critical products document necessary fields and exclusions.", "3": "Release controls verify purpose-bound minimization.", "4": "Usage and risk evidence continuously reduce unnecessary data."}, evidence_guidance: "Review a redacted product contract showing included and prohibited fields.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY]}
  - {id: SP-04, text: "How are masking and pseudonymization controls selected?", anchors: {"0": "Sensitive fields are exposed without protection.", "1": "Masking is applied inconsistently in consumer tools.", "2": "Critical fields have documented protection patterns.", "3": "Patterns are tested against purpose role and re-identification risk.", "4": "Threat and outcome evidence continuously improves protection."}, evidence_guidance: "Review synthetic raw and protected field outputs.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY]}
  - {id: SP-05, text: "How is raw sensitive data separated from governed products?", anchors: {"0": "Raw sensitive data is broadly accessible.", "1": "Separation relies on conventions or shared locations.", "2": "Critical raw and governed zones have distinct identities and access.", "3": "Policy tests prove raw denial and safe product allowance.", "4": "Continuous verification detects and prevents boundary regression."}, evidence_guidance: "Review synthetic allow and deny results for fixed assets.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-SECURITY]}
  - {id: SP-06, text: "How are identity roles defined for critical data access?", anchors: {"0": "Access uses shared or undefined identities.", "1": "Individual grants accumulate without role design.", "2": "Critical access uses named least-privilege roles.", "3": "Roles have owners separation constraints and review cadence.", "4": "Observed use continuously rightsizes roles and removes excess access."}, evidence_guidance: "Review a redacted role definition and approved membership example.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-07, text: "How are least-privilege policies versioned and reviewed?", anchors: {"0": "Policies are absent or unversioned.", "1": "Changes occur through manual administration.", "2": "Critical policies are versioned and peer reviewed.", "3": "Tests and approvals bind each change to expected decisions.", "4": "Decision outcomes continuously improve policy design and review."}, evidence_guidance: "Review a redacted versioned policy change and approval.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-08, text: "How does policy enforcement fail for unknown roles and assets?", anchors: {"0": "Unknown identities or assets may be allowed.", "1": "Failure behavior varies across applications.", "2": "Critical boundaries default-deny unknown roles and assets.", "3": "Negative tests prove denial before data access or query construction.", "4": "Adversarial testing continuously challenges fail-closed behavior."}, evidence_guidance: "Review synthetic unknown-role and unknown-asset denial tests.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-09, text: "How are policy decisions separated from user-supplied query input?", anchors: {"0": "Users can supply unrestricted paths tables or queries.", "1": "Input filtering relies on fragile string rules.", "2": "Critical interfaces accept only fixed role and asset identifiers.", "3": "Tests reject SQL path command and expression inputs before execution.", "4": "Threat testing continuously validates the narrow decision boundary."}, evidence_guidance: "Review synthetic rejection tests without executing arbitrary input.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-10, text: "How are access grants approved and time-bounded?", anchors: {"0": "Access grants lack approval and expiry.", "1": "Approval exists in informal requests.", "2": "Critical grants record approver purpose and review date.", "3": "Time bounds and renewal evidence are enforced.", "4": "Grant outcomes and usage continuously reduce standing access."}, evidence_guidance: "Review a redacted grant with purpose approval and expiry.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY, R-GOVERNANCE]}
  - {id: SP-11, text: "How is access revocation tested?", anchors: {"0": "Revocation is not defined or tested.", "1": "Teams remove access manually after requests.", "2": "Critical roles have documented revocation procedures.", "3": "Tests verify timely denial across decision and data boundaries.", "4": "Revocation performance and incidents continuously improve controls."}, evidence_guidance: "Review a synthetic revocation test and elapsed-time evidence.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-12, text: "How are access and policy decisions audited?", anchors: {"0": "Access decisions are not auditable.", "1": "Partial logs exist without stable identities or outcomes.", "2": "Critical decisions record identity asset policy and result.", "3": "Logs are protected retained reviewed and linked to investigations.", "4": "Detection outcomes continuously improve audit coverage and signals."}, evidence_guidance: "Review redacted synthetic allow and deny audit events.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-13, text: "How are suspicious access patterns detected and escalated?", anchors: {"0": "Suspicious access is not detected.", "1": "Teams manually inspect logs after incidents.", "2": "Critical patterns have basic detection and owners.", "3": "Alert triage escalation and containment are tested.", "4": "Threat and incident learning continuously improves detection."}, evidence_guidance: "Review a redacted synthetic alert and response timeline.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY]}
  - {id: SP-14, text: "How are retention and deletion rules enforced?", anchors: {"0": "Sensitive data is retained without governed limits.", "1": "Retention is documented but manually applied.", "2": "Critical data has owned retention and deletion rules.", "3": "Enforcement and exceptions are tested and evidenced.", "4": "Outcome and regulatory change continuously improve lifecycle policy."}, evidence_guidance: "Review a redacted retention rule and synthetic deletion evidence.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-GOVERNANCE]}
  - {id: SP-15, text: "How are backups and derived copies included in privacy controls?", anchors: {"0": "Backups and derived copies are outside control scope.", "1": "Teams know some copies but lack complete treatment.", "2": "Critical copies are inventoried under retention and access rules.", "3": "Restoration deletion and protection paths are tested.", "4": "Copy discovery and recovery outcomes continuously improve control."}, evidence_guidance: "Review a redacted copy inventory and synthetic lifecycle test.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-SECURITY]}
  - {id: SP-16, text: "How are privacy and security exceptions governed?", anchors: {"0": "Exceptions are undocumented or permanent.", "1": "Exceptions exist in tickets without consistent controls.", "2": "Critical exceptions name approver rationale safeguards and expiry.", "3": "Monitoring and fail-closed expiry are independently reviewed.", "4": "Exception trends reduce through control and architecture improvement."}, evidence_guidance: "Review a redacted exception record and expiry outcome.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-SECURITY, R-GOVERNANCE]}
  - {id: SP-17, text: "How are third-party and service access boundaries assessed?", anchors: {"0": "Third-party access is not assessed.", "1": "Contract or network reviews occur inconsistently.", "2": "Critical access identifies purpose data roles and controls.", "3": "Approval tests monitoring and termination evidence are required.", "4": "Provider outcomes continuously refine access and sourcing decisions."}, evidence_guidance: "Review a redacted third-party access assessment.", duration_minutes: 4, linked_recommendation_ids: [R-SECURITY, R-GOVERNANCE]}
  - {id: SP-18, text: "How are AI training and inference data uses approved?", anchors: {"0": "AI data use proceeds without explicit approval.", "1": "Project approval does not bind datasets purposes or controls.", "2": "Critical AI uses name data purpose owner and limitations.", "3": "Approval verifies minimization policy evidence and lifecycle.", "4": "Observed outcomes and drift continuously refine approved use."}, evidence_guidance: "Review a redacted AI-use approval with prohibited uses.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-AI-OPERATING]}
  - {id: SP-19, text: "How are privacy and security controls tested before release?", anchors: {"0": "Controls are released without tests.", "1": "Teams perform manual happy-path checks.", "2": "Critical controls have deterministic allow and deny tests.", "3": "Release gates include bypass revocation retention and audit cases.", "4": "Adversarial and mutation tests continuously challenge controls."}, evidence_guidance: "Review synthetic positive negative bypass and boundary tests.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-SECURITY]}
  - {id: SP-20, text: "How is security privacy and policy effectiveness reviewed?", anchors: {"0": "Control effectiveness is not reviewed.", "1": "Activity counts substitute for protection outcomes.", "2": "Critical controls receive periodic evidence-based review.", "3": "Independent review covers design operation exceptions and incidents.", "4": "Measured outcomes continuously improve policy architecture and investment."}, evidence_guidance: "Review a redacted effectiveness assessment and accountable roadmap.", duration_minutes: 4, linked_recommendation_ids: [R-PRIVACY, R-SECURITY, R-GOVERNANCE]}
