schema_version: 1.0.0
demo_content_version: 1.0.0
stages:
  - id: DEMO-INGESTION
    title: Deterministic source and ingestion evidence
    presenter_goal: Explain the current deterministic ingestion proof, its exact stage manifest, and the boundary between tracked implementation and generated local data.
    prerequisites:
      - The repository source files and Phase 6 stage manifest are available for read-only inspection.
      - Current proof was executed outside this guide with the pinned small scale and seed 42 fixture.
    artifacts:
      - {label: Phase 6 ingestion stage manifest, path: demo/manifests/stages/ingestion.yaml, expected: Current executed provenance and five of five automated eligible run and cleanup rows., status: unavailable}
      - {label: Synthetic generator source, path: data-generator/generate.py, expected: Deterministic eighteen-table synthetic retail generator listed by the stage manifest., status: unavailable}
      - {label: Raw landing source, path: ingestion/load_raw.py, expected: Idempotent local DuckDB landing entrypoint listed by the stage manifest., status: unavailable}
    expected_evidence:
      - The stage manifest labels the proof current and executed with 5/5 eligible run and cleanup rows automated.
      - Both manifest-listed tracked artifacts are visible with repository-derived availability.
    limitations:
      - The guide does not generate data, open DuckDB, or repeat the current proof.
      - Synthetic sandbox evidence is not customer ingestion evidence.
    cleanup:
      - No cleanup is performed by the guide.
      - Separately generated state remains governed by the existing demo runbook.
    read_only: true
    non_scoring: true
  - id: DEMO-QUALITY-QUARANTINE
    title: Quality validation and quarantine evidence
    presenter_goal: Explain the current accepted and quarantine partition proof without querying either relation from the guide.
    prerequisites:
      - The Phase 6 quality stage manifest and both complementary dbt models are available for read-only inspection.
      - Current proof was executed outside this guide against the pinned deterministic fixture.
    artifacts:
      - {label: Phase 6 quality and quarantine stage manifest, path: demo/manifests/stages/quality-quarantine.yaml, expected: Current executed provenance and four of four automated eligible run and cleanup rows., status: unavailable}
      - {label: Quarantine orders model, path: transform/dbt/models/quarantine/quarantine_orders.sql, expected: Invalid-status partition source listed by the stage manifest., status: unavailable}
      - {label: Accepted orders model, path: transform/dbt/models/curated/accepted_orders.sql, expected: Allowed-status partition source listed by the stage manifest., status: unavailable}
    expected_evidence:
      - Current retained proof covers non-empty quarantine, partition disjointness and completeness, and governed-product exclusion.
      - The canonical eleven legacy marts keep their existing contract.
    limitations:
      - One controlled invalid-status rule is not comprehensive quality coverage.
      - No dbt model is built and no generated relation is queried by the guide.
    cleanup:
      - No cleanup is performed by the guide.
      - Generated quality state remains removable through the established repository workflow.
    read_only: true
    non_scoring: true
  - id: DEMO-TRANSFORMATION
    title: Versioned transformation and orchestration evidence
    presenter_goal: Explain the current dbt and exact Airflow DAG proof while keeping orchestration outside the read-only assessment surface.
    prerequisites:
      - The Phase 6 transformation stage manifest and both listed implementation sources are available.
      - Current DAG success means an exact run was polled to terminal success outside this guide.
    artifacts:
      - {label: Phase 6 transformation stage manifest, path: demo/manifests/stages/transformation.yaml, expected: Current executed provenance and four of four automated eligible run and cleanup rows., status: unavailable}
      - {label: dbt project, path: transform/dbt/dbt_project.yml, expected: Layered project including the additive quality and AI-ready schemas listed by the stage manifest., status: unavailable}
      - {label: Airflow TaskFlow DAG, path: orchestration/airflow/dags/retail_batch_pipeline.py, expected: Default retail DAG source listed by the stage manifest., status: unavailable}
    expected_evidence:
      - The manifest distinguishes terminal DAG-run proof from source presence or UI startup.
      - Airflow was staged alone and did not overlap lake or governance profiles.
    limitations:
      - The guide does not run dbt, trigger Airflow, or start a service.
      - Tracked source presence alone is not a current successful execution claim.
    cleanup:
      - No cleanup is performed by the guide.
      - Separately operated orchestration state follows the existing staged runbook.
    read_only: true
    non_scoring: true
  - id: DEMO-METADATA
    title: Metadata catalog evidence
    presenter_goal: Present historical OpenMetadata proof and state plainly that current OpenMetadata execution is unexecuted.
    prerequisites:
      - The Phase 6 metadata stage manifest and its two tracked OpenMetadata references are available.
      - A local ingestion-bot token is intentionally not tracked or requested by this guide.
    artifacts:
      - {label: Phase 6 metadata stage manifest, path: demo/manifests/stages/metadata.yaml, expected: Historical provenance with current OpenMetadata execution explicitly unexecuted and two of two automated eligible run and cleanup rows., status: unavailable}
      - {label: OpenMetadata runbook, path: governance/openmetadata/README.md, expected: Staged local ingestion and verification boundary listed by the stage manifest., status: unavailable}
      - {label: dbt metadata ingestion configuration, path: governance/openmetadata/ingestion/dbt_ingestion.yaml, expected: Logical dbt ingestion definition listed by the stage manifest., status: unavailable}
    expected_evidence:
      - Historical proof stays labeled historical and does not become a current claim.
      - Current OpenMetadata execution is unexecuted because the separately supplied local token was not used.
    limitations:
      - No OpenMetadata service, credential, or ingestion workflow is invoked.
      - The documented search and server memory limits remain 1g and 2g.
    cleanup:
      - No cleanup is performed by the guide.
      - Any separately operated catalog is managed by the existing staged runbook.
    read_only: true
    non_scoring: true
  - id: DEMO-LINEAGE
    title: Source-to-product lineage evidence
    presenter_goal: Explain current logical lineage proof and the intentional boundary between the additive AI-ready product and eleven physical legacy marts.
    prerequisites:
      - The Phase 6 lineage stage manifest and both listed tracked references are available.
      - Current dbt lineage proof was generated outside this guide.
    artifacts:
      - {label: Phase 6 lineage stage manifest, path: demo/manifests/stages/lineage.yaml, expected: Current executed provenance and three of three automated eligible run and cleanup rows., status: unavailable}
      - {label: System architecture, path: docs/system-architecture.md, expected: Logical DuckDB and physical Iceberg identity boundary listed by the stage manifest., status: unavailable}
      - {label: Curated asset inventory, path: lake/curated_assets.json, expected: Canonical inventory of eleven legacy marts listed by the stage manifest., status: unavailable}
    expected_evidence:
      - The AI-ready product resolves to accepted orders and staged customers.
      - The canonical eleven-mart inventory excludes the additive product.
    limitations:
      - Tracked architecture is not a substitute for a current OpenMetadata run.
      - Logical dbt and physical Iceberg assets remain intentionally distinct.
    cleanup:
      - No cleanup is performed by the guide.
      - Generated lineage artifacts remain under existing repository cleanup boundaries.
    read_only: true
    non_scoring: true
  - id: DEMO-GOVERNANCE
    title: Governance ownership and classification evidence
    presenter_goal: Explain the current synthetic PII-like classification and governed product contract without treating it as customer governance maturity.
    prerequisites:
      - The Phase 6 governance stage manifest and both listed dbt metadata contracts are available.
      - Current classification and masking proof was executed outside this guide.
    artifacts:
      - {label: Phase 6 governance stage manifest, path: demo/manifests/stages/governance.yaml, expected: Current executed provenance and three of three automated eligible run and cleanup rows., status: unavailable}
      - {label: Staging classification contract, path: transform/dbt/models/staging/_staging__models.yml, expected: Synthetic customers email classification listed by the stage manifest., status: unavailable}
      - {label: Governed product contract, path: transform/dbt/models/products/_products__models.yml, expected: Ownership classification and safe column contract listed by the stage manifest., status: unavailable}
    expected_evidence:
      - Synthetic customers.email is classified as restricted PII-like input.
      - Raw identity fields are absent from the governed output.
    limitations:
      - Classification applies to deterministic synthetic demo data only.
      - This evidence does not assert customer governance maturity.
    cleanup:
      - No cleanup is performed by the guide.
      - The guide stores no customer policy, customer data, or generated product bytes.
    read_only: true
    non_scoring: true
  - id: DEMO-POLICY-ACCESS
    title: Policy-based access evidence
    presenter_goal: Explain the current fixed-role raw-deny and safe-product-allow proof plus the limitation of a local application boundary.
    prerequisites:
      - The Phase 6 access-control stage manifest and both listed policy sources are available.
      - Current allow and deny proof was executed outside this guide through the fixed CLI interface.
    artifacts:
      - {label: Phase 6 access-control stage manifest, path: demo/manifests/stages/access-control.yaml, expected: Current executed provenance and two of two automated eligible run and cleanup rows., status: unavailable}
      - {label: Local access policy, path: governance/policy/access-policy.yaml, expected: Fixed-role and fixed-asset policy listed by the stage manifest., status: unavailable}
      - {label: Policy enforcement entrypoint, path: governance/policy/export_authorized_dataset.py, expected: Fixed-interface local enforcement source listed by the stage manifest., status: unavailable}
    expected_evidence:
      - Raw staging classified-email unknown-role and unknown-asset requests fail while the sole safe product succeeds.
      - Arbitrary SQL database paths output paths and relation inputs are absent from the policy interface.
    limitations:
      - The guide exposes no policy command, SQL input, data export, or access-decision control.
      - The application-level control is not DuckDB IAM; a local machine owner can bypass it.
    cleanup:
      - No cleanup is performed by the guide.
      - Separately generated policy output remains bounded to its explicit generated root.
    read_only: true
    non_scoring: true
  - id: DEMO-SERVING
    title: Governed serving and analytics evidence
    presenter_goal: Explain the current shared eleven-mart serving proof without starting Rill, lake services, or publication from the guide.
    prerequisites:
      - The Phase 6 serving stage manifest and both listed implementation artifacts are available.
      - Current staged local proof was executed outside this guide.
    artifacts:
      - {label: Phase 6 serving stage manifest, path: demo/manifests/stages/serving.yaml, expected: Current executed provenance and four of four automated eligible run and cleanup rows., status: unavailable}
      - {label: Curated asset inventory, path: lake/curated_assets.json, expected: Shared eleven-mart Parquet Rill and Iceberg inventory listed by the stage manifest., status: unavailable}
      - {label: Mart snapshot exporter, path: serving/export_marts_snapshot.py, expected: Local Parquet export implementation listed by the stage manifest., status: unavailable}
    expected_evidence:
      - Exactly eleven legacy business marts remain in the canonical publication inventory.
      - The additive AI-ready product stays outside the Parquet Rill and Iceberg inventory loops.
    limitations:
      - Historical GH-3 proof may illustrate serving but never scores customer readiness.
      - The guide performs no object-store, service, or cloud action.
    cleanup:
      - No cleanup is performed by the guide.
      - Separately operated serving state follows the existing staged runbook.
    read_only: true
    non_scoring: true
  - id: DEMO-AI-READY-PUBLICATION
    title: Versioned AI-ready data product publication
    presenter_goal: Explain the current governed product source, versioned dataset manifest, and honestly reported availability of its declared output.
    prerequisites:
      - The Phase 6 publication stage manifest and both listed tracked artifacts are available.
      - Generated product bytes may be absent and are never created by this guide.
    artifacts:
      - {label: Phase 6 AI-ready publication stage manifest, path: demo/manifests/stages/ai-ready-publication.yaml, expected: Current executed provenance and three of three automated eligible run and cleanup rows., status: unavailable}
      - {label: Governed product model, path: transform/dbt/models/products/ai_ready_customer_product.sql, expected: Pseudonymous product source listed by the stage manifest., status: unavailable}
      - {label: AI-ready dataset manifest, path: demo/manifests/ai-ready-customer-product.v1.yaml, expected: Versioned owner contract SLA access lineage and reproduction manifest listed by the stage manifest., status: unavailable}
      - {label: Declared current product output, path: demo/evidence/current/ai-ready-customer-product.csv, expected: Generated output declared by the dataset manifest; unavailable until retained by a separate current proof run., status: unavailable}
    expected_evidence:
      - The dataset manifest binds ownership schema service levels access lineage reproduction and checksums.
      - Artifact availability reports local path presence and does not infer execution or scoring.
    limitations:
      - No AI model is trained and no dataset is uploaded or deployed.
      - The product is a bounded synthetic demonstration outside the canonical eleven marts.
    cleanup:
      - No cleanup is performed by the guide.
      - Generated product bytes remain reproducible and removable without deleting tracked sources.
    read_only: true
    non_scoring: true
