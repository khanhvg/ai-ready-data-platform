chains:
  - finding_id: F-OWNERSHIP
    gap: Critical data and AI decisions lack named accountable owners and decision rights.
    impact: Unowned decisions delay remediation and leave critical AI use without accountable risk acceptance.
    priority: Critical blocker
    recommendation_id: R-OWNERSHIP
    architecture_id: ARCH-OPERATING-MODEL
    technology_option_ids: [alternative-infrastructure-source]
    profile_role_refs:
      - {profile_id: aws-first-profile, role_ids: [infrastructure-source]}
    demo_reference_id: DEMO-PLACEHOLDER-OWNERSHIP
    owner_role: Executive data sponsor
    horizon: 0-30 days
    success_measure: Every critical product and control has one named accountable owner and review cadence.
    edges:
      - {source: gap, target: impact, kind: causes}
      - {source: impact, target: priority, kind: prioritized-as}
      - {source: priority, target: recommendation, kind: addressed-by}
      - {source: recommendation, target: architecture, kind: implemented-through}
      - {source: architecture, target: technology-options, kind: has-options}
      - {source: technology-options, target: demo, kind: illustrated-by}
      - {source: demo, target: action, kind: owned-through}
