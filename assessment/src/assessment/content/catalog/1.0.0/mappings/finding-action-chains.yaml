      - {profile_id: local-demo-evidence, role_ids: [local-transformation]}
    demo_reference_id: DEMO-PLACEHOLDER-QUALITY
    owner_role: Data quality owner
    horizon: 0-30 days
    success_measure: Critical rules are measured and every failed record is excluded or explicitly accepted.
