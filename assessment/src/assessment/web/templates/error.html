{% extends "base.html" %}
{% block content %}
<section class="error-summary" role="alert" tabindex="-1" data-error-summary>
  <p class="eyebrow">Validation stopped the operation</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if engagement_id %}
  <p><a href="/engagements/{{ engagement_id }}/quick">Return to the saved assessment</a></p>
  {% else %}
  <p><a href="/engagements">Return to engagements</a></p>
  {% endif %}
</section>
{% endblock %}
