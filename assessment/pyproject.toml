[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-assessment-prototype"
version = "0.2.0"
description = "Offline AI-ready assessment contracts, prototype, and portable local storage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Jinja2==3.1.6",
  "jsonschema==4.24.0",
  "Pillow==11.3.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
]

[project.scripts]
assessment-prototype = "prototype.run:main"
assessment = "assessment.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
  "prototype",
  "assessment",
  "assessment.content",
  "assessment.domain",
  "assessment.public_schemas",
  "assessment.storage",
]
package-dir = {assessment = "src/assessment"}

[tool.setuptools.package-data]
prototype = ["0.1.0/*.yaml", "*.j2", "*.css"]
"assessment.public_schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]
