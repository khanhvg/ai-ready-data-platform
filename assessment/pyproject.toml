[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-assessment-prototype"
version = "0.5.0"
description = "Local-first AI-ready assessment workflow, deterministic reports, and portability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.0",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.6",
  "jsonschema==4.24.0",
  "Pillow==11.3.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.32",
  "PyYAML==6.0.2",
  "uvicorn==0.51.0",
]

[project.scripts]
assessment-prototype = "prototype.run:main"
assessment = "assessment.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
  "prototype",
  "assessment",
  "assessment.catalog",
  "assessment.content",
  "assessment.domain",
  "assessment.engine",
  "assessment.framework_assets",
  "assessment.public_schemas",
  "assessment.reporting",
  "assessment.storage",
  "assessment.web",
  "assessment.web.static",
  "assessment.web.templates",
]
package-dir = {assessment = "src/assessment"}

[tool.setuptools.package-data]
prototype = ["0.1.0/*.yaml", "*.j2", "*.css"]
"assessment.public_schemas" = ["*.schema.json"]
"assessment.content" = [
  "catalog/1.0.0/**/*.yaml",
  "catalog/1.0.0/diagrams/*.mmd",
  "catalog/1.0.0/diagrams/*.svg",
  "catalog/1.0.0/diagrams/*.json",
  "demo/1.0.0/*.yaml",
]
assessment = [
  "framework_assets/1.0.0/*.yaml",
  "framework_assets/1.0.0/*.j2",
  "framework_assets/1.0.0/*.css",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "e2e: real loopback Chromium lifecycle tests run by the dedicated target",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["build/", "dist/"]
